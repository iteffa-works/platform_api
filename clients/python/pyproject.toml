[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-client"
version = "0.1.0"
description = "Тонкий SDK для Client API (/api/client/v1)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["platform_client"]
