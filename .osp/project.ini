[sandbox.local]

app_start_command = npm run dev
backend_enabled   = on
backend_ip        = 127.0.0.1
backend_port      = 5173
base_url          = https://sandbox.local
bind_ip           = auto
environment       = System Node-24.22.1 Nginx
http_engine       = Nginx
http_port         = 80
https_port        = 443
node_engine       = Node-24.22.1
php_engine        = 
primary_domain    = on
project_category  = Node.js
project_enabled   = on
project_root      = {base_dir}
server_aliases    = www.{host}
terminal_codepage = 65001
tls_cert_file     = auto
tls_enabled       = on
tls_key_file      = auto
web_root          = {base_dir}\web
